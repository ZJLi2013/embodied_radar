name: embodied
title: 具身机器人技术雷达

# The LLM judge (t4) reads these definitions; the collector does not filter on them.
scope:
  include:
    - 机器人「大脑」：基础模型、VLA、世界模型、策略学习与控制算法
    - 通用基座模型或 agent 用在机器人或具身仿真环境上的工作
    - 面向机器人的数据、仿真与训练基础设施
  exclude:
    - 硬件本体（人形、四足等整机）本身
    - 自动驾驶、航天器
    - 没有落到机器人或具身环境上的通用 AI 内容
  business:
    - 融资、合作与政府项目、人事、产品上市与营销、市场报告、活动、赞助内容

# Page channels fetch each new link once on their first run to read its date; capped per page.
page:
  first_run_date_fetch_max: 12

# Supplementary open search for teams outside the list (SearXNG in the workflow).
search:
  backend: searxng
  max_results: 10
  interval_seconds: 1.0
  retries: 2
