name: radar-collect

on:
  workflow_dispatch:
    inputs:
      domain:
        description: Domain under domains/
        default: embodied
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Scheduled runs have no inputs; both expressions fall back to the same domain.
    concurrency:
      group: radar-collect-${{ inputs.domain || 'embodied' }}
      cancel-in-progress: false
    env:
      DOMAIN: ${{ inputs.domain || 'embodied' }}
    steps:
      - uses: actions/checkout@v4
      # A queued run must not collect from the SHA it was triggered at; take the state the previous run pushed.
      - name: Pull latest state
        run: git pull --ff-only origin main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[test]" ./LLMProvider
      - run: pytest -q
      - name: Start SearXNG
        run: |
          docker run -d --name searxng -p 8080:8080 -v "$PWD/ci/searxng:/etc/searxng" searxng/searxng:latest
          for i in $(seq 1 30); do
            curl -sf "http://localhost:8080/search?q=robot&format=json" > /dev/null && exit 0
            sleep 3
          done
          docker logs searxng | tail -50
          exit 1
      - name: Collect
        run: python -m radar.collect --domain "$DOMAIN"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Judge, wiki and report
        run: python -m radar.weekly --domain "$DOMAIN"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # The model the scope judge was validated with; changing it needs a new validation.
          DEEPSEEK_MODEL: deepseek-chat
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collect-${{ env.DOMAIN }}
          path: out/${{ env.DOMAIN }}/latest/
      - name: Commit state and candidates
        run: |
          run_date=$(python -c "import json, sys; print(json.load(open(sys.argv[1]))['run_date'])" "out/$DOMAIN/latest/summary.json")
          dest="history/$DOMAIN/$run_date-$GITHUB_RUN_ID"
          mkdir -p "$dest"
          cp "out/$DOMAIN/latest/items.jsonl" "out/$DOMAIN/latest/summary.json" "out/$DOMAIN/latest/judged.jsonl" "$dest/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "state/$DOMAIN/" "history/$DOMAIN/" "wiki/$DOMAIN/" "reports/$DOMAIN/" README.md
          git commit -m "更新 $DOMAIN 渠道状态、候选、wiki 与周报（$run_date）"
          git push origin HEAD:main
