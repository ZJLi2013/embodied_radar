name: radar-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[test]"
      - run: pytest -q
      - run: python -m radar.probe domains/embodied out/probe/probe.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe
          path: out/probe/
