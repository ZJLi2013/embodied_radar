[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radar"
version = "0.1.0"
description = "Weekly domain radar: team channels (RSS, pages, GitHub, Hugging Face), dedupe and wiki tools"
requires-python = ">=3.11"
dependencies = [
    "ddgs>=9.0",
    "feedparser>=6.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "trafilatura>=1.12",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["radar*"]
